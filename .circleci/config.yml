version: 2.1

orbs:
  slack: circleci/slack@4.3.0
  
jobs:
  Build:
    docker:
    - image: cimg/base:stable
    resource_class: small
    steps:
    - checkout
    - run: 
        name: Build
        command: |
          docker build -t mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM .
          export BUILD_NUM=$CIRCLE_BUILD_NUM
          echo $BUILD_NUM > build_number.txt
          cat build_number.txt
    - run: 
        name: Save Image
        command: |
          docker save -o ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
    - run: 
        name: Save Artifacts
        command: |
          docker save -o ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
    - slack/notify:
        event: fail
        template: basic_fail_1
    - setup_remote_docker:
        version: 20.10.14
    - persist_to_workspace:
        root: .
        paths:
          - .

  Deploy:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "8b:33:2d:a8:af:61:c2:d7:08:84:bc:18:a9:3d:56:e0"
      - run:
          name: Add Key 
          command: |
            ssh-keyscan 104.197.93.189 >> ~/.ssh/known_hosts
      - run: 
          name: Transfere Image 
          command: |
            export BUILD_NUM=$(cat build_number.txt)
            scp ./mentorme-fe-$CIRCLE_BRANCH:$BUILD_NUM.tar mentormetesting@104.197.93.189:~/docker/
      - run: 
          name: Deploy 
          command: |
            export BUILD_NUM=$(cat build_number.txt)
            export SERVICE_NAME=$( echo $CIRCLE_REPOSITORY_URL | cut -d / -f 5 | cut -d - -f 2)
            ssh mentormetesting@104.197.93.189 -o "StrictHostKeyChecking=no" -o SendEnv=$BUILD_NUM -o SendEnv=$CIRCLE_BRANCH \<< EOF 
            docker load -i ~/docker/mentorme-fe-$CIRCLE_BRANCH:$BUILD_NUM.tar
            rm -rf ~/docker/*
            sed -i 's/BUILD_NO_FE=.*/BUILD_NO_FE=$BUILD_NUM/' ~/$CIRCLE_BRANCH/app/.env
            cd ~/$CIRCLE_BRANCH/app
            docker-compose up -d $SERVICE_NAME
            docker-compose restart $SERVICE_NAME
            docker rmi -f $(docker images -q | tail -n +3) 2>/dev/null exit 0
            EOF
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
      - persist_to_workspace:
          root: .
          paths:
            - .
  
workflows:
  mentorme-fe-workflow:
    jobs:
      - Build
      - Deploy:
          requires:
            - Build
          filters:
            branches:
              only:
                - master
                - staging 
                - devops

