version: 2.1

orbs:
  slack: circleci/slack@4.3.0
  
jobs:
  Build:
    docker:
    - image: cimg/base:stable
    resource_class: small
    steps:
    - checkout
    - run: 
        name: Build Image
        command: |
          export SERVICE_NAME=`echo Mentorship-frontend | cut -d - -f 2`
          export BUILD_NUM=$CIRCLE_BUILD_NUM
          echo $BUILD_NUM > BUILD_NUM
          docker build --no-cache -t mentorme-$SERVICE_NAME-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM .
    - run: 
        name: Save Artifacts
        command: |
          export SERVICE_NAME=`echo Mentorship-frontend | cut -d - -f 2`
          docker save -o ./mentorme-$SERVICE_NAME-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-$SERVICE_NAME-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
    - slack/notify:
        event: fail
        template: basic_fail_1
    - setup_remote_docker:
        version: 20.10.14
    - persist_to_workspace:
        root: .
        paths:
          - .

  Deploy:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "8b:33:2d:a8:af:61:c2:d7:08:84:bc:18:a9:3d:56:e0"
      - run:
          name: Add Key 
          command: |
            ssh-keyscan 104.197.93.189 >> ~/.ssh/known_hosts
      - run: 
          name: Transfere Artifacts 
          command: |
            export SERVICE_NAME=`echo Mentorship-frontend | cut -d - -f 2`
            export BUILD_NUM=$(cat BUILD_NUM)
            scp ./mentorme-$SERVICE_NAME-$CIRCLE_BRANCH:$BUILD_NUM.tar mentormetesting@104.197.93.189:~/docker/
      - run: 
          name: Deploy 
          command: |
            export SERVICE_NAME=`echo Mentorship-frontend | cut -d - -f 2`
            export BUILD_NUM=$(cat BUILD_NUM)
            export SERVICE_NAME_ENV=`echo $SERVICE_NAME | tr [:lower:] [:upper:]`

            ssh mentormetesting@104.197.93.189 -o "StrictHostKeyChecking=no" -o SendEnv=$BUILD_NUM -o SendEnv=$CIRCLE_BRANCH  -o SendEnv=$SERVICE_NAME -o SendEnv=SERVICE_NAME_ENV \<< EOF 
            
            echo $SERVICE_NAME_ENV
            docker load -i ~/docker/mentorme-$SERVICE_NAME-$CIRCLE_BRANCH:$BUILD_NUM.tar
            rm -rf ~/docker/*
            sed -i "s/BUILD_NO_$SERVICE_NAME_ENV=.*/BUILD_NO_$SERVICE_NAME_ENV=$BUILD_NUM/" ~/$CIRCLE_BRANCH/app/.env
            sed -i "s/BUILD_NO_$SERVICE_NAME_ENV=.*/BUILD_NO_$SERVICE_NAME_ENV=$BUILD_NUM/"
            cd ~/$CIRCLE_BRANCH/app
            docker-compose up -d --force-recreate $SERVICE_NAME
            EOF
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
      - persist_to_workspace:
          root: .
          paths:
            - .
  
workflows:
  mentorme-workflow:
    jobs:
      - Build
      - Deploy:
          requires:
            - Build
          filters:
            branches:
              only:
                - master
                - staging 
                - devops

