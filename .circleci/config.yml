version: 2.1

orbs:
  slack: circleci/slack@4.3.0
  
jobs:
  Build:
    docker:
    - image: cimg/base:stable
    steps:
    - checkout
    - run: 
        name: Build
        command: |
          docker build -t mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM .
          export BUILD_NUM=$CIRCLE_BUILD_NUM
          echo $BUILD_NUM > build_number.txt
          cat build_number.txt
    - run: 
        name: Save Image
        command: |
          docker save -o ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
          ls
    - run: 
        name: Save Artifacts
        command: |
          docker save -o ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
    - slack/notify:
        event: fail
        template: basic_fail_1
    - setup_remote_docker:
        version: 20.10.14
    - persist_to_workspace:
        root: .
        paths:
          - .

  Deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "ab:fc:1e:d2:02:81:7f:ec:5e:68:24:a3:2e:0d:bf:41"
      - run:
          name: Scan Key
          command: |
            ssh-keyscan 34.28.81.97 >> ~/.ssh/known_hosts
      - run: 
          name: Transfere Image 
          command: |
            export BUILD_NUM=$(cat build_number.txt)
            echo $BUILD_NUM
            scp ./mentorme-fe-$CIRCLE_BRANCH:$BUILD_NUM.tar mohamed@34.28.81.97:~/docker/
      - run: 
          name: Deploy 
          command: |
            docker load -i ~/docker/mentorme-fe-$CIRCLE_BRANCH:$BUILD_NUM.tar
            ssh mohamed@34.28.81.97 -o "StrictHostKeyChecking=no" -o SendEnv=$BUILD_NUM -o SendEnv=$CIRCLE_BRANCH \<< EOF 
            sed -i 's/BUILD_NO_FE=.*/BUILD_NO_FE=$BUILD_NUM/' .env
            cd ~/$CIRCLE_BRANCH/app
            docker-compose up frontend
            EOF
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
      - persist_to_workspace:
          root: .
          paths:
            - .
  
workflows:
  mentorme-fe-workflow:
    jobs:
      - Build
      - Deploy:
          requires:
          - Build

