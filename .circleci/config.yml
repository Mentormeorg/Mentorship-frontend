version: 2.1

orbs:
  slack: circleci/slack@4.3.0
  
jobs:
  Build:
    docker:
    - image: cimg/base:stable
    steps:
    - checkout
    - run: 
        name: Build
        command: |
          docker build -t mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM .
    - run: 
        name: Save Image
        command: |
          docker save -o ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM
    - slack/notify:
        event: fail
        template: basic_fail_1
    - setup_remote_docker:
        version: 20.10.14
    - persist_to_workspace:
        root: .
        paths:
          - .

  Deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "a5:46:1e:b2:2a:c2:01:55:8d:cd:bb:1f:b5:a9:91:f8"
      - run:
          name: Scan Key
          command: |
            ssh-keyscan 34.28.81.97 >> ~/.ssh/known_hosts
      - run: 
          name: Transfere Image 
          command: |
            scp ./mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar mohamed@34.28.81.97:~/Docker
      - run: 
          name: Deploy 
          command: |
            docker load -i ~/Docker/mentorme-fe-$CIRCLE_BRANCH:$CIRCLE_BUILD_NUM.tar
            ssh mohamed@34.28.81.97 -o "StrictHostKeyChecking=no" -o SendEnv=$CIRCLE_BUILD_NUM -o SendEnv=$CIRCLE_BRANCH \<< EOF 
            sed -i 's/BUILD_NO_FE=.*/BUILD_NO_FE=$CIRCLE_BUILD_NUM/' .env
            cd ~/$CIRCLE_BRANCH/app
            docker-compose up frontend
            EOF
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
      - persist_to_workspace:
          root: .
          paths:
            - .
  
workflows:
  mentorme-fe-workflow:
    jobs:
      - Build
      - Deploy:
          requires:
          - Build

