<form [formGroup]="biographyForm">
  <div class="mb-6">
    <span class="p-float-label">
      <p-autoComplete
        #skillsAutocomplete
        class="w-full"
        id="skills"
        name="skills"
        formControlName="skills"
        [suggestions]="filteredSkills"
        (completeMethod)="filterSkills($event)"
        [multiple]="true"
        placeholder="Type to search or add custom skill (press Enter/Tab)"
        [showClear]="true"
        [dropdown]="false"
        [forceSelection]="false"
        (onKeyDown)="onSkillsKeyDown($event)"
      ></p-autoComplete>
      <label htmlFor="skills">Skills</label>
    </span>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('skills')">
      {{ getErrorMessage('skills') }}
    </small>
  </div>
  <div class="mb-6">
    <span class="p-float-label">
      <p-autoComplete
        #toolsAutocomplete
        class="w-full"
        id="tools"
        name="tools"
        formControlName="tools"
        [suggestions]="filteredTools"
        (completeMethod)="filterTools($event)"
        [multiple]="true"
        placeholder="Type to search or add custom tool (press Enter/Tab)"
        [showClear]="true"
        [dropdown]="false"
        [forceSelection]="false"
        (onKeyDown)="onToolsKeyDown($event)"
      ></p-autoComplete>
      <label htmlFor="tools">Tools</label>
    </span>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('tools')">
      {{ getErrorMessage('tools') }}
    </small>
  </div>
  <div class="mb-6">
    <span class="p-float-label">
      <textarea
        rows="5"
        cols="30"
        pInputTextarea
        formControlName="careerStory"
        placeholder="Write your career path story here..."
      ></textarea>
      <label htmlFor="careerStory">Career Story</label>
    </span>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('careerStory')">
      {{ getErrorMessage('careerStory') }}
    </small>
  </div>
</form>
<div class="controller d-flex gap-4">
  <p-button
    styleClass="p-button-primary p-button-text"
    (click)="prevStep()"
  >
    <- Back
  </p-button>
  <p-button
    styleClass="p-button-primary p-button-text"
    [disabled]="!biographyForm.valid"
    (click)="nextStep()"
    *ngIf="userRole === RolesEnum.MENTOR"
  >
    Next ->
  </p-button>
  <p-button
    styleClass="p-button-primary p-button-text"
    [disabled]="!biographyForm.valid"
    (click)="nextStep()"
    *ngIf="userRole !== RolesEnum.MENTOR"
  >
    Finish
  </p-button>
</div>
