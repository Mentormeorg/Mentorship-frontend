<form [formGroup]="perferenceForm">
  <div class="mb-6">
    <p class="d-block mb-3 lable">
      how many mentees capacity you can have?
    </p>
    <p-inputNumber
      class="d-flex"
      styleClass="w-full "
      [showButtons]="true"
      buttonLayout="horizontal"
      inputId="horizontal"
      placeholder="Enter number of mentees"
      formControlName="numberOfMentees"
      spinnerMode="horizontal"
      [step]="1"
      [max]="4"
      [min]="0"
      decrementButtonClass="p-button-parimary"
      incrementButtonClass="p-button-parimary"
      incrementButtonIcon="pi pi-plus"
      decrementButtonIcon="pi pi-minus"
    ></p-inputNumber>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('numberOfMentees')">
      {{ getErrorMessage('numberOfMentees') }}
    </small>
  </div>
  <div class="mb-6">
    <p class="d-block mb-3 lable">
      how much time want to spend mentoring someone?
    </p>
    <div class="p-inputgroup">
      <input
        pInputText
        placeholder="Enter hours per week"
        formControlName="timeToSpend"
      />
      <span class="p-inputgroup-addon"> Hr </span>
    </div>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('timeToSpend')">
      {{ getErrorMessage('timeToSpend') }}
    </small>
  </div>
  <div class="mb-6">
    <p class="d-block mb-3 lable">
      how much your price for mentoring someone per hour?
    </p>
    <div class="p-inputgroup">
      <input
        pInputText
        placeholder="Enter price per hour"
        formControlName="pricePerHour"
      />
      <span class="p-inputgroup-addon"> $ </span>
    </div>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('pricePerHour')">
      {{ getErrorMessage('pricePerHour') }}
    </small>
  </div>
</form>
<div class="controller d-flex gap-4">
  <p-button
    styleClass="p-button-primary p-button-text"
    (click)="prevStep()"
  >
    <- Back
  </p-button>
  <p-button
    styleClass="p-button-primary p-button-text"
    [disabled]="!perferenceForm.valid"
    (click)="finish()"
  >
    Finish
  </p-button>
</div>
