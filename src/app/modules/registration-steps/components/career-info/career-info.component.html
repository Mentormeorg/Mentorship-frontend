<div [formGroup]="experincesForm">
  <div class="mb-6">
    <span class="p-float-label">
      <p-inputNumber
        inputId="totalYearsOfExperience"
        formControlName="totalYearsOfExperience"
        id="totalYearsOfExperience"
        name="totalYearsOfExperience"
        class="w-full"
        styleClass="w-full"
        [max]="50"
      />
      <label htmlFor="totalYearsOfExperience">Total Years of Experience</label>
    </span>
    <small class="p-error d-block mt-2" *ngIf="getErrorMessage('totalYearsOfExperience')">
      {{ getErrorMessage('totalYearsOfExperience') }}
    </small>
  </div>
  <div formArrayName="experinces">
    <div
      class="mb-6 experinces-form-container"
      *ngFor="let experince of experinces.controls; let i = index"
      [formGroupName]="i"
    >
      <span class="delete" *ngIf="i !== 0">
        <i
          class="pi pi-times-circle"
          (click)="deleteExperince(i)"
        ></i>
      </span>
      <div class="mb-6">
        <span class="p-float-label">
          <input
            class="w-full"
            pInputText
            id="jobTitle"
            name="jobTitle"
            formControlName="jobTitle"
          />
          <label htmlFor="jobTitle">Job Title</label>
        </span>
        <small class="p-error d-block mt-2" *ngIf="getExperienceErrorMessage(i, 'jobTitle')">
          {{ getExperienceErrorMessage(i, 'jobTitle') }}
        </small>
      </div>
      <div class="mb-6">
        <span class="p-float-label">
          <input
            class="w-full"
            pInputText
            formControlName="workedAt"
            id="workAt"
            name="workAt"
          />
          <label htmlFor="workAt">Worked at</label>
        </span>
        <small class="p-error d-block mt-2" *ngIf="getExperienceErrorMessage(i, 'workedAt')">
          {{ getExperienceErrorMessage(i, 'workedAt') }}
        </small>
      </div>
      <div class="mb-6">
        <span class="p-float-label">
          <p-inputNumber
            inputId="integeronly"
            formControlName="experienceYears"
            id="experienceYears"
            name="experienceYears"
            class="w-full"
            styleClass="w-full"
            [max]="50"
          />
          <label htmlFor="experienceYears">Experince years</label>
        </span>
        <small class="p-error d-block mt-2" *ngIf="getExperienceErrorMessage(i, 'experienceYears')">
          {{ getExperienceErrorMessage(i, 'experienceYears') }}
        </small>
      </div>
      <div class="mb-6">
        <p-dropdown
          [options]="seniorityLevels"
          formControlName="seniorityLevel"
          placeholder="Select seniority level"
          styleClass="w-full"
          optionLabel="label"
          optionValue="value"
        ></p-dropdown>
        <small class="p-error d-block mt-2" *ngIf="getExperienceErrorMessage(i, 'seniorityLevel')">
          {{ getExperienceErrorMessage(i, 'seniorityLevel') }}
        </small>
      </div>
    </div>
  </div>
</div>

<p-button
  styleClass="p-button w-full d-flex gap-4 align-items-center justify-content-center mb-8 p-button-outlined"
  (click)="addExperince()"
>
  <i class="pi pi-plus-circle" style="font-size: 2rem"></i>
  Add Experince</p-button
>
<div class="controller d-flex gap-4">
  <p-button
    styleClass="p-button-primary p-button-text"
    (click)="prevStep()"
  >
    <- Back
  </p-button>
  <p-button
    styleClass="p-button-primary p-button-text"
    (click)="nextStep()"
    [disabled]="!experincesForm.valid"
  >
    Next ->
  </p-button>
</div>
