<form [formGroup]="roleForm">
  <p>I'm A</p>
  <div class="form-check">
    <label>
      <input
        formControlName="role"
        type="radio"
        name="role"
        [value]="RolesEnum.MENTOR"
      />
      <span>
        <img src="assets/images/mentor-emoji.png" alt="" />
      </span>
      Mentor
    </label>
    <label>
      <input
        formControlName="role"
        type="radio"
        name="role"
        [value]="RolesEnum.MENTEE"
      />
      <span>
        <img src="assets/images/mentee-emoji.png" alt="" />
      </span>
      Mentee
    </label>
  </div>
</form>
<div class="w-100 d-flex gap-2">
  <p-button
    styleClass="p-button-primary p-button-text"
    (click)="nextStep()"
    [disabled]="!roleForm.valid"
  >
    Next
    <i class="pi pi-arrow-right"></i>
  </p-button>
</div>
