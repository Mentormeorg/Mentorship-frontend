<h1>{{ authService.isAuthenticated | async }}</h1>
<div class="signin-container signin">
    <div class="signin-intro intro text-center">
        <h1 class="intro-header">Welcome to Mentorchief</h1>
        <p class="intro-desc">
            Lorem ipsum dolor sit amet consectetur. Nec aenean pellentesque est
            porta gravida aliquam sed.
        </p>
    </div>
    <div class="signin-social_buttons">
        <p-button
            styleClass="p-button-secondary p-button-text"
            (click)="signIn('google')"
        >
            <span
                class="flex gap-3 align-items-center justify-content-center flex-1"
            >
                <img src="assets/images/helpers/Google.png" alt="" />
                <p class="button-label text-center">Login with Google</p>
            </span>
        </p-button>

        <p-button
            styleClass="p-button-secondary p-button-text"
            (click)="signIn('linkedin')"
        >
            <span
                class="flex gap-3 align-items-center justify-content-center flex-1"
            >
                <img src="assets/images/helpers/Linkedin.png" alt="" />
                <p class="text-center button-label">Login with LinkedIn</p>
            </span>
        </p-button>
        <p-button
            styleClass="p-button-secondary p-button-text"
            (click)="signIn('github')"
        >
            <span
                class="flex gap-3 align-items-center justify-content-center flex-1"
            >
                <img width="30" src="assets/images/helpers/github.png" alt="" />
                <p class="text-center button-label">Login with Github</p>
            </span>
        </p-button>
    </div>
    <p-divider align="center" class="mt-8 mb-7 block">
        <div class="inline-flex align-items-center">
            <b>or</b>
        </div>
    </p-divider>

    <div class="signin-form">
        <form autocomplete="off" role="presentation">
            <span class="p-float-label mb-5">
                <input class="w-full" pInputText id="email" name="email" />
                <label htmlFor="email">Email</label>
            </span>
            <span class="p-float-label">
                <input
                    class="w-full"
                    pInputText
                    [(ngModel)]="password"
                    name="Passwrod"
                    id="password"
                    type="password"
                />
                <label htmlFor="password">Password</label>
            </span>
            <div class="flex justify-content-end p-1 pt-3 forget-password">
                <a [routerLink]="'/'">Forgot password?</a>
            </div>
            <p-button
                styleClass="p-button-primary submit-email p-button-text w-full flex justify-content-center"
                (click)="signIn('email')"
            >
                Login
            </p-button>

            <p class="hint">
                Don’t have an account? ?
                <a class="mr-2 uppercase" [routerLink]="'/auth/sign-up'"
                    >sign up</a
                >
            </p>
        </form>
    </div>
</div>
